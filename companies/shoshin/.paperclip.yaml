schema: paperclip/v1

# MCP servers
# gbrain: shared institutional memory (World Mobile knowledge, project state, niche intel)
# In-cluster HTTP MCP. Agents query via natural language. No API keys required.
# Docs: https://github.com/garrytan/gbrain/blob/master/docs/tutorials/company-brain.md
mcp_servers:
  gbrain:
    url: http://gbrain-jarvis-company.gbrain.svc.cluster.local:3131/mcp

# Routines (scheduled agent tasks)
# Each routine slug matches a tasks/<slug>/TASK.md body.
# Paperclip fires the assignee agent at each cron tick.
# Defaults: concurrencyPolicy=coalesce_if_active, catchUpPolicy=skip_missed.
# All times Europe/Amsterdam.
routines:
  trend-scan:
    triggers:
      - kind: schedule
        cronExpression: "0 6 * * *"
        timezone: Europe/Amsterdam
  weekly-sprint:
    triggers:
      - kind: schedule
        cronExpression: "0 10 * * 1"
        timezone: Europe/Amsterdam
  friday-brief:
    triggers:
      - kind: schedule
        cronExpression: "0 16 * * 5"
        timezone: Europe/Amsterdam
